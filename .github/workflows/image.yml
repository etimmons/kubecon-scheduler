name: image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Chromium and its system packages come preinstalled, so the job doesn't depend on reaching the
    # Ubuntu package mirrors (an apt step there once hung for hours). Keep the tag in step with
    # @playwright/test in package.json.
    container: mcr.microsoft.com/playwright:v1.65.0-resolute
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
        env:
          CI: "true"

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # "latest" is set explicitly below, only for release tags.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern=v{{version}}
            # Follows the most recent release. Pre-releases (v1.2.0-rc.1) don't move it.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
