apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecon-scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate # ReadWriteOnce volume, single writer
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubecon-scheduler
          image: kubecon-scheduler
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: USER_HEADER
              value: Remote-User
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kubecon-scheduler-data
        - name: tmp
          emptyDir: {}
