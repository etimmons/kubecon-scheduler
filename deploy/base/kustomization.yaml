apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spellbook
labels:
  - pairs:
      app.kubernetes.io/name: spellbook
    includeSelectors: true
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
# The Deployment's image is the bare name "spellbook"; each overlay sets it with `images:`.
