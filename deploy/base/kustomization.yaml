apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spellbook
labels:
  - pairs:
      app.kubernetes.io/name: spellbook
    includeSelectors: true
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
images:
  - name: spellbook
    newName: ghcr.io/OWNER/spellbook # set in your overlay
    newTag: main
