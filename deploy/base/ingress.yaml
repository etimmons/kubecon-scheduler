# Two Ingresses on one host, so forward-auth can be attached to /api only.
# The overlay sets the host and attaches the auth middleware (see deploy/overlays/example).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubecon-scheduler-public # app shell, schedule.json and /sync (device tokens): no login
spec:
  rules:
    - host: kubecon-scheduler.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: kubecon-scheduler, port: { name: http } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubecon-scheduler-api # /api/*: behind Authelia forward-auth, which sets Remote-User
spec:
  rules:
    - host: kubecon-scheduler.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: kubecon-scheduler, port: { name: http } }
