# Only the ingress controller may reach the pod, so Remote-User can only come from forward-auth.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spellbook
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system # the ingress controller's namespace; patch in your overlay
      ports:
        - port: http
